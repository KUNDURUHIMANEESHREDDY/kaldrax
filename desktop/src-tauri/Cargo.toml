[package]
name = "kaldrax-desktop"
version = "0.1.0"
description = "KALDRAX engineering control center desktop application"
authors = ["KALDRAX"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "kaldrax_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
