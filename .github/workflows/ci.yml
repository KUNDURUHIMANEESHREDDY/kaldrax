name: KALDRAX CI

on:
  push:
    branches: [main]
    tags: ["v0.6.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Run project memory retrieval benchmark
        run: python -m kaldrax.cli memory benchmark

      - name: Run source-backed lexical versus hybrid benchmark baseline
        run: python -m kaldrax.cli memory benchmark-compare

      - name: Run evaluator acceptance benchmark
        run: python -m kaldrax.cli benchmark-evaluator --mode deterministic --min-accuracy 0.80

      - name: Verify Docker sandbox execution
        if: matrix.python-version == '3.13'
        run: |
          docker pull python:3.13-slim
          printf "print('KALDRAX_SANDBOX_SMOKE_OK')\n" > "$RUNNER_TEMP/kaldrax_sandbox_smoke.py"
          python -m kaldrax.cli sandbox run-python "$RUNNER_TEMP/kaldrax_sandbox_smoke.py" --timeout 20

      - name: Verify repository patch, Docker tests, review, and apply integration
        if: matrix.python-version == '3.13'
        env:
          KALDRAX_RUN_DOCKER_INTEGRATION: "1"
        run: python -m pytest -q tests/test_engineering_integration.py

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Build complete memory evaluation report and enforce CI floors
        if: matrix.python-version == '3.13'
        run: |
          python -m kaldrax.cli memory quality-report \
            --profile ci \
            --json-report artifacts/memory-quality.json \
            --markdown-report artifacts/memory-quality.md

      - name: Upload memory evaluation evidence
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: kaldrax-memory-quality-${{ github.sha }}
          path: artifacts/memory-quality.*
          if-no-files-found: warn

  desktop-check:
    name: Desktop lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Run Oxlint
        run: npm run lint

      - name: Build desktop frontend
        run: npm run build

  provider-smoke:
    name: Optional live provider smoke test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e .

      - name: Check provider secrets and model variables
        id: provider-secrets
        shell: bash
        env:
          KALDRAX_API_KEY: ${{ secrets.KALDRAX_API_KEY }}
          KALDRAX_MODEL: ${{ vars.KALDRAX_MODEL }}
          KALDRAX_EVALUATOR_MODEL: ${{ vars.KALDRAX_EVALUATOR_MODEL }}
        run: |
          if [[ -n "$KALDRAX_API_KEY" && -n "$KALDRAX_MODEL" && -n "$KALDRAX_EVALUATOR_MODEL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Provider smoke skipped: configure KALDRAX_API_KEY and the model repository variables."
          fi

      - name: Verify live executor and evaluator endpoints
        if: steps.provider-secrets.outputs.configured == 'true'
        env:
          KALDRAX_API_KEY: ${{ secrets.KALDRAX_API_KEY }}
          KALDRAX_MODEL: ${{ vars.KALDRAX_MODEL }}
          KALDRAX_EVALUATOR_MODEL: ${{ vars.KALDRAX_EVALUATOR_MODEL }}
          KALDRAX_BASE_URL: ${{ vars.KALDRAX_BASE_URL }}
        run: python -m kaldrax.cli provider-check

      - name: Run live memory extraction quality benchmark
        if: steps.provider-secrets.outputs.configured == 'true'
        env:
          KALDRAX_API_KEY: ${{ secrets.KALDRAX_API_KEY }}
          KALDRAX_MODEL: ${{ vars.KALDRAX_MODEL }}
          KALDRAX_BASE_URL: ${{ vars.KALDRAX_BASE_URL }}
          KALDRAX_MAX_TOKENS: "1024"
          KALDRAX_MAX_PROVIDER_CALLS: "40"
          KALDRAX_MAX_RUN_INPUT_TOKENS: "60000"
          KALDRAX_MAX_RUN_OUTPUT_TOKENS: "36000"
          KALDRAX_MAX_RUN_TOTAL_TOKENS: "100000"
          KALDRAX_MAX_RUN_DURATION_SECONDS: "600"
        run: python -m kaldrax.cli memory extraction-benchmark


  memory-release-gate:
    name: v0.6 memory evidence and release thresholds
    if: startsWith(github.ref, 'refs/tags/v0.6.')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e .

      - name: Run strict memory release gate
        env:
          KALDRAX_API_KEY: ${{ secrets.KALDRAX_API_KEY }}
          KALDRAX_MODEL: ${{ vars.KALDRAX_MODEL }}
          KALDRAX_BASE_URL: ${{ vars.KALDRAX_BASE_URL }}
          KALDRAX_EMBEDDING_MODEL: ${{ vars.KALDRAX_EMBEDDING_MODEL }}
          KALDRAX_EMBEDDING_API_KEY: ${{ secrets.KALDRAX_EMBEDDING_API_KEY }}
          KALDRAX_EMBEDDING_BASE_URL: ${{ vars.KALDRAX_EMBEDDING_BASE_URL }}
          KALDRAX_RETRIEVAL_DATASET: ${{ vars.KALDRAX_RETRIEVAL_DATASET }}
          KALDRAX_CONTRADICTION_DATASET: ${{ vars.KALDRAX_CONTRADICTION_DATASET }}
          KALDRAX_EXTRACTION_DATASET: ${{ vars.KALDRAX_EXTRACTION_DATASET }}
          KALDRAX_MAX_TOKENS: "1024"
          KALDRAX_MAX_PROVIDER_CALLS: "40"
          KALDRAX_MAX_RUN_INPUT_TOKENS: "60000"
          KALDRAX_MAX_RUN_OUTPUT_TOKENS: "36000"
          KALDRAX_MAX_RUN_TOTAL_TOKENS: "100000"
          KALDRAX_MAX_RUN_DURATION_SECONDS: "600"
        run: |
          python -m kaldrax.cli memory quality-report \
            --profile release \
            --dataset "${KALDRAX_RETRIEVAL_DATASET:-benchmarks/memory_retrieval_kaldrax_v1.json}" \
            --contradiction-dataset "${KALDRAX_CONTRADICTION_DATASET:-benchmarks/memory_contradictions_v1.json}" \
            --extraction-dataset "${KALDRAX_EXTRACTION_DATASET:-benchmarks/memory_extraction_v1.json}" \
            --approval-file benchmarks/memory_quality_review_v1.json \
            --live-extraction \
            --json-report artifacts/memory-quality-release.json \
            --markdown-report artifacts/memory-quality-release.md

      - name: Upload strict release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaldrax-v0.6-release-evidence-${{ github.sha }}
          path: artifacts/memory-quality-release.*
          if-no-files-found: warn
